<table mat-table [dataSource]="casos" class="mat-elevation-z8">

  <ng-container matColumnDef="nuc">
    <th mat-header-cell *matHeaderCellDef> NUC </th>
    <td mat-cell *matCellDef="let caso"> {{caso.nuc}} </td>
  </ng-container>

  <ng-container matColumnDef="titulo">
    <th mat-header-cell *matHeaderCellDef> Título </th>
    <td mat-cell *matCellDef="let caso"> {{caso.titulo}} </td>
  </ng-container>

  <ng-container matColumnDef="estado">
    <th mat-header-cell *matHeaderCellDef> Estado </th>
    <td mat-cell *matCellDef="let caso"> {{caso.estado}} </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef> Acciones </th>
    <td mat-cell *matCellDef="let caso">
      <button mat-icon-button color="primary" (click)="seleccionarCaso(caso)">
        <mat-icon>edit_document</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
