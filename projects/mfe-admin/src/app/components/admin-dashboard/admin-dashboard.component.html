<!-- Contenedor principal usando Angular Material Card -->
<mat-card class="admin-card">
  <mat-card-header>
    <mat-card-title>Administración de Usuarios</mat-card-title>
    <mat-card-subtitle>
      Gestión centralizada de roles y accesos (MFE Admin)
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>

    <!--
      Usamos *ngIf con async pipe para esperar los datos.
      'users' será el array de usuarios una vez que el Observable users$ emita.
    -->
    <div *ngIf="users$ | async as users; else loading">

      <!-- Si no hay usuarios, mostrar un mensaje -->
      <div *ngIf="users.length === 0" class="empty-state">
        No se encontraron usuarios para mostrar.
      </div>

      <!-- Si hay usuarios, mostrar la tabla -->
      <table mat-table [dataSource]="users" class="mat-elevation-z4 full-width-table" *ngIf="users.length > 0">

        <!-- Columna Nombre Completo -->
        <ng-container matColumnDef="nombreCompleto">
          <th mat-header-cell *matHeaderCellDef> Nombre </th>
          <td mat-cell *matCellDef="let user"> {{user.nombreCompleto}} </td>
        </ng-container>

        <!-- Columna Usuario (Username) -->
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef> Usuario </th>
          <td mat-cell *matCellDef="let user"> {{user.username}} </td>
        </ng-container>

        <!-- Columna Rol -->
        <ng-container matColumnDef="rol">
          <th mat-header-cell *matHeaderCellDef> Rol </th>
          <td mat-cell *matCellDef="let user">
            <!-- Usamos clases CSS para estilizar el rol -->
            <span class="role-badge" [class.admin]="user.rol === 'ADMIN'">
              {{user.rol}}
            </span>
          </td>
        </ng-container>

        <!-- Columna ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID de Usuario </th>
          <td mat-cell *matCellDef="let user">
            <span class="id-text">{{user.id}}</span>
          </td>
        </ng-container>

        <!-- Definición de las filas de cabecera y datos -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <!-- Indicador de Carga (se muestra mientras users$ no ha emitido) -->
    <ng-template #loading>
      <div class="loading-indicator">
        Cargando usuarios...
        <!-- Podrías poner un spinner de Material aquí -->
        <!-- <mat-spinner diameter="50"></mat-spinner> -->
      </div>
    </ng-template>

  </mat-card-content>
</mat-card>
